<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Fixture — Interaction Lab</title>
<style>
  :root {
    --brand: #6d5efc;
    --brand-2: #ff7a59;
    --radius: 14px;
    --ease-out: cubic-bezier(.22,1,.36,1);
    --shadow-1: 0 1px 2px rgba(0,0,0,.08);
    --shadow-2: 0 18px 40px rgba(109,94,252,.35);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; background:#0b0b12; color:#f5f5ff; }
  header { position: sticky; top:0; padding:18px 32px; backdrop-filter: blur(14px); background:rgba(11,11,18,.72); z-index:10; }
  h1 { font-size: 44px; letter-spacing:-.03em; margin:0 0 12px; }
  .pulse { animation: pulse 2.4s var(--ease-out) infinite; }
  @keyframes pulse { 0%,100% { opacity:.55; transform: scale(1) } 50% { opacity:1; transform: scale(1.06) } }
  .float { animation: floaty 5s ease-in-out infinite alternate; }
  @keyframes floaty { from { transform: translateY(0) } to { transform: translateY(-14px) } }
  .card {
    padding:24px; border-radius:var(--radius); border:1px solid rgba(255,255,255,.1);
    transition: transform .35s var(--ease-out), box-shadow .35s var(--ease-out), border-color .35s;
    will-change: transform;
  }
  .card:hover { transform: translateY(-6px) scale(1.015); box-shadow: var(--shadow-2); border-color: rgba(109,94,252,.6); }
  .btn {
    position:relative; overflow:hidden; cursor:pointer; border:0; border-radius:999px;
    padding:14px 26px; font-size:16px; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand-2));
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.96); }
  .ripple { position:absolute; border-radius:50%; background:rgba(255,255,255,.55); transform:scale(0); pointer-events:none; }
  .reveal { opacity:0; transform: translateY(28px); transition: opacity .7s var(--ease-out), transform .7s var(--ease-out); }
  .reveal.in { opacity:1; transform:none; }
  section { padding:64px 32px; }
  .grid { display:grid; gap:18px; grid-template-columns:repeat(3,1fr); }
  .spacer { height:120vh; }
  .cursor-dot { width:18px;height:18px;border-radius:50%;background:var(--brand);position:fixed;left:0;top:0;pointer-events:none; }
</style>
</head>
<body>
<header><strong>Fixture Lab</strong></header>
<main>
  <section>
    <h1>Interaction Lab</h1>
    <p class="pulse">Pulsing text (CSS keyframes)</p>
    <div class="grid" style="margin-top:32px">
      <article class="card float"><h2>Card A</h2><p>Hover me</p></article>
      <article class="card"><h2>Card B</h2><p>Hover me too</p></article>
      <article class="card"><h2>Card C</h2><p>And me</p></article>
    </div>
    <p style="margin-top:28px"><button class="btn" id="play">Play sound + ripple</button></p>
  </section>
  <div class="spacer"></div>
  <section>
    <div class="grid">
      <article class="card reveal"><h2>Reveal 1</h2></article>
      <article class="card reveal"><h2>Reveal 2</h2></article>
      <article class="card reveal"><h2>Reveal 3</h2></article>
    </div>
  </section>
  <audio id="sfx" src="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA="></audio>
</main>
<script>
  // click ripple (WAAPI) + WebAudio beep
  let ac
  const btn = document.getElementById('play')
  btn.addEventListener('click', (e) => {
    const r = document.createElement('span')
    r.className = 'ripple'
    const s = 90
    r.style.width = r.style.height = s + 'px'
    r.style.left = (e.offsetX - s / 2) + 'px'
    r.style.top = (e.offsetY - s / 2) + 'px'
    btn.appendChild(r)
    r.animate([{ transform: 'scale(0)', opacity: .7 }, { transform: 'scale(2.6)', opacity: 0 }], { duration: 520, easing: 'ease-out' })
      .finished.then(() => r.remove())
    ac = ac || new (window.AudioContext || window.webkitAudioContext)()
    const o = ac.createOscillator(); const g = ac.createGain()
    o.type = 'sine'; o.frequency.value = 880
    o.connect(g); g.connect(ac.destination)
    g.gain.setValueAtTime(.12, ac.currentTime)
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .18)
    o.start(); o.stop(ac.currentTime + .2)
    // audio element playback too
    document.getElementById('sfx').play().catch(() => {})
  })
  // scroll reveal
  const io = new IntersectionObserver((es) => {
    for (const en of es) if (en.isIntersecting) en.target.classList.add('in')
  }, { threshold: .25 })
  document.querySelectorAll('.reveal').forEach((el) => io.observe(el))
  // cursor follower (rAF loop)
  const dot = document.createElement('div'); dot.className = 'cursor-dot'; document.body.appendChild(dot)
  let tx = 0, ty = 0
  window.addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY })
  ;(function loop() {
    const cur = dot.getBoundingClientRect()
    dot.style.transform = `translate(${tx}px, ${ty}px)`
    requestAnimationFrame(loop)
  })()
  // scroll listener
  window.addEventListener('scroll', () => {}, { passive: true })
  // GSAP-ish marker for library detection
  window.__FI /* noop */
</script>
</body>
</html>
